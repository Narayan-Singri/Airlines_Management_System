<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search and compare flights with FlyNow Airlines. Live dynamic seat availability and transparent fares.">
  <title>Flight Search Results | FlyNow Airlines</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/search.css">
</head>
<body>

  <!-- Site Header -->
  <header id="site-header" class="site-header"></header>

  <main class="search-results-page">
    <div class="container">

      <!-- STEPPER NAVIGATION -->
      <nav class="stepper" aria-label="Booking progress">
        <div class="step-item active">
          <div class="step-number">1</div>
          <span>Select Flight</span>
        </div>
        <div class="step-divider"></div>
        <div class="step-item">
          <div class="step-number">2</div>
          <span>Choose Seats</span>
        </div>
        <div class="step-divider"></div>
        <div class="step-item">
          <div class="step-number">3</div>
          <span>Review & Pay</span>
        </div>
        <div class="step-divider"></div>
        <div class="step-item">
          <div class="step-number">4</div>
          <span>Confirmation</span>
        </div>
      </nav>

      <!-- SEARCH MODIFICATION BAR -->
      <section class="modify-search-bar" aria-label="Search modification bar">
        <form id="modify-search-form" class="modify-grid">
          <div class="form-group">
            <label class="form-label" for="modify-from">From</label>
            <select id="modify-from" class="form-control" required>
              <option value="">Origin City</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="modify-to">To</label>
            <select id="modify-to" class="form-control" required>
              <option value="">Destination City</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="modify-date">Departure Date</label>
            <input type="date" id="modify-date" class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label" for="modify-class">Cabin Class</label>
            <select id="modify-class" class="form-control">
              <option value="ALL">All Classes</option>
              <option value="ECONOMY">Economy</option>
              <option value="BUSINESS">Business Class</option>
            </select>
          </div>

          <div class="form-group">
            <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem 1.25rem;">
              <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i> Update
            </button>
          </div>
        </form>
      </section>

      <!-- MAIN RESULTS LAYOUT -->
      <div class="results-layout">
        <!-- FILTERS SIDEBAR -->
        <aside class="filter-sidebar" aria-label="Flight filters">
          <div class="filter-header">
            <h3 style="font-size: 1rem; margin: 0;">Filters</h3>
            <button type="button" id="btn-reset-filters" class="btn btn-sm btn-outline" style="border: none; color: var(--color-primary); padding: 0;">
              Reset All
            </button>
          </div>

          <!-- Price Range Filter -->
          <div class="filter-section">
            <div class="filter-title">Maximum Price</div>
            <div class="price-slider-wrapper">
              <input type="range" id="filter-max-price" min="2000" max="25000" step="500" value="25000">
              <div class="price-slider-labels">
                <span>₹2,000</span>
                <span id="price-slider-value" style="color: var(--color-primary);">Up to ₹25,000</span>
              </div>
            </div>
          </div>

          <!-- Departure Time Slots Filter -->
          <div class="filter-section">
            <div class="filter-title">Departure Time</div>
            <label class="filter-checkbox-label">
              <input type="checkbox" name="time_slot" value="morning" checked>
              <span>Morning (00:00 - 11:59)</span>
            </label>
            <label class="filter-checkbox-label">
              <input type="checkbox" name="time_slot" value="afternoon" checked>
              <span>Afternoon (12:00 - 17:59)</span>
            </label>
            <label class="filter-checkbox-label">
              <input type="checkbox" name="time_slot" value="evening" checked>
              <span>Evening (18:00 - 23:59)</span>
            </label>
          </div>

          <!-- Availability Filter -->
          <div class="filter-section">
            <div class="filter-title">Seat Availability</div>
            <label class="filter-checkbox-label">
              <input type="checkbox" id="filter-available-only" checked>
              <span>Hide sold out flights</span>
            </label>
          </div>
        </aside>

        <!-- FLIGHT RESULTS MAIN -->
        <section aria-label="Available flight results">
          <div class="results-header-bar">
            <div>
              <h2 id="results-headline" style="font-size: 1.5rem; margin-bottom: 4px;">Available Flights</h2>
              <p id="results-subtext" class="text-sm text-muted">Searching scheduled flights...</p>
            </div>

            <div class="sort-group">
              <label for="sort-select" class="text-xs font-semibold text-muted">Sort By:</label>
              <select id="sort-select" class="sort-select">
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="dep_asc">Departure: Earliest</option>
                <option value="duration_asc">Duration: Shortest</option>
                <option value="seats_desc">Available Seats: Most</option>
              </select>
            </div>
          </div>

          <!-- Cards List -->
          <div id="flight-cards-container" class="flight-cards-list">
            <!-- Loading Skeletons -->
            <div class="skeleton" style="height: 140px; margin-bottom: 16px;"></div>
            <div class="skeleton" style="height: 140px; margin-bottom: 16px;"></div>
            <div class="skeleton" style="height: 140px;"></div>
          </div>
        </section>
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Page Logic -->
  <script type="module" src="js/pages/search.js"></script>
</body>
</html>
