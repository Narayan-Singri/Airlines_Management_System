<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Airline operations, ground staff, and pilot authorization portal.">
  <title>Staff & Flight Operations Portal | FlyNow Airlines</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/staff.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body class="staff-body">

  <main class="auth-page" style="background: radial-gradient(circle at 50% 20%, #1E293B 0%, #0F172A 80%);">
    <div class="staff-card" style="max-width: 480px; width: 100%;">
      <div class="auth-header">
        <div style="width: 44px; height: 44px; background: var(--color-accent); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto; box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);">
          <i data-lucide="shield" style="width: 24px; height: 24px;"></i>
        </div>
        <h2>Airline Operations Portal</h2>
        <p class="text-xs text-muted" style="color: #94A3B8;">Authorized personnel only: Ground Staff, Flight Crew, Operations & Administrators.</p>
      </div>

      <!-- Quick Role Autofill Selectors -->
      <div style="background: #0F172A; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 20px;">
        <div class="text-xs font-bold text-muted mb-2">QUICK FILL DEMO OPERATOR:</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" class="btn btn-outline btn-xs btn-autofill" data-email="ravi@air.test" data-role="Ground Staff" style="color: #38BDF8; border-color: #334155;">
            Ground Staff
          </button>
          <button type="button" class="btn btn-outline btn-xs btn-autofill" data-email="arjun@air.test" data-role="Pilot" style="color: #38BDF8; border-color: #334155;">
            Flight Ops / Pilot
          </button>
          <button type="button" class="btn btn-outline btn-xs btn-autofill" data-email="admin@air.test" data-role="Admin" style="color: #38BDF8; border-color: #334155;">
            System Admin
          </button>
        </div>
      </div>

      <!-- Staff Login Form -->
      <form id="staff-login-form">
        <div class="form-group mb-4">
          <label class="form-label" for="staff-email" style="color: #94A3B8;">Staff Email / Employee ID</label>
          <div class="input-icon-wrapper">
            <i data-lucide="mail" class="input-icon" style="width: 18px; height: 18px; color: #64748B;"></i>
            <input type="email" id="staff-email" class="form-control staff-input" placeholder="operator@air.test" required>
          </div>
        </div>

        <div class="form-group mb-6">
          <label class="form-label" for="staff-password" style="color: #94A3B8;">Password</label>
          <div class="input-icon-wrapper">
            <i data-lucide="lock" class="input-icon" style="width: 18px; height: 18px; color: #64748B;"></i>
            <input type="password" id="staff-password" class="form-control staff-input" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" id="btn-staff-submit" class="btn btn-accent btn-lg btn-block">
          <span>Authorize Access</span>
          <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
        </button>
      </form>

      <div class="text-center mt-6">
        <a href="/index.html" style="color: #64748B; font-size: 13px;">
          <i data-lucide="arrow-left" style="width: 14px; height: 14px; display: inline;"></i> Return to Public Site
        </a>
      </div>
    </div>
  </main>

  <script type="module" src="../js/pages/staff-login.js"></script>
</body>
</html>
