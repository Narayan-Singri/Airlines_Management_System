<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track live flight status, operational timeline, and safety inspection ratings on FlyNow Airlines.">
  <title>Live Flight Status & Safety | FlyNow Airlines</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/status.css">
</head>
<body>

  <!-- Site Header -->
  <header id="site-header" class="site-header"></header>

  <main class="status-page">
    <div class="container" style="max-width: 860px;">

      <!-- Search Form -->
      <section class="card mb-8" aria-label="Flight status lookup form">
        <h1 style="font-size: 1.75rem; margin-bottom: 6px;">Live Flight Tracker & Status</h1>
        <p class="text-sm text-muted mb-6">Real-time departure, arrival, and pre-flight technical safety inspection updates.</p>

        <form id="flight-status-search-form" style="display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--space-4); align-items: flex-end;">
          <div class="form-group">
            <label class="form-label" for="lookup-flight-no">Flight Number</label>
            <div class="input-icon-wrapper">
              <i data-lucide="plane" class="input-icon" style="width: 18px; height: 18px;"></i>
              <input type="text" id="lookup-flight-no" class="form-control" placeholder="e.g. AI-101" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="lookup-date">Date (Optional)</label>
            <input type="date" id="lookup-date" class="form-control">
          </div>

          <div class="form-group">
            <button type="submit" id="btn-track-submit" class="btn btn-primary" style="padding: 0.75rem 1.75rem;">
              <i data-lucide="search" style="width: 16px; height: 16px;"></i> Track
            </button>
          </div>
        </form>
      </section>

      <!-- Results Display Container -->
      <div id="status-results-container">
        <!-- Initial placeholder -->
        <div class="card empty-state">
          <div class="empty-state-icon">
            <i data-lucide="activity" style="width: 32px; height: 32px;"></i>
          </div>
          <h3>Check Operational Status</h3>
          <p class="text-sm text-muted">Enter a flight number above (e.g. AI-101 or 6E-202) to track status.</p>
        </div>
      </div>

    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="js/pages/status.js"></script>
</body>
</html>
